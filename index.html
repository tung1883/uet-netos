<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ điều hành mạng UET</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #8b8f99;
    --accent: #4c8dff;
    --good: #22c55e;
    --bad: #ef4444;
    --unanswered: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 80px; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 1.4rem; margin: 0 0 4px; }
  header p { color: var(--muted); margin: 0; font-size: 0.9rem; }

  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px; margin-bottom: 16px; position: sticky; top: 8px; z-index: 10;
  }
  .topbar .count { font-weight: 600; }
  .topbar .timer { font-family: monospace; font-size: 1.1rem; }
  .topbar .timer.warn { color: var(--bad); }

  .progress-bar { height: 6px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
  .progress-fill { height: 100%; background: var(--accent); transition: width .2s; }

  .question {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; margin-bottom: 16px;
  }
  .question .qheader { margin-bottom: 20px; }
  .question .qn { color: var(--accent); font-weight: 700; margin-right: 6px; }
  .question .qtype { color: var(--muted); font-size: 0.75rem; font-weight: 600; margin-right: 6px; border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }
  .question .qtext { font-weight: 600; line-height: 1.5; }
  .question.flag-unanswered { border-color: var(--unanswered); box-shadow: 0 0 0 1px var(--unanswered) inset; }

  .opt {
    display: block; padding: 12px 14px; margin-bottom: 8px;
    border: 1px solid var(--border); border-radius: 10px; cursor: pointer;
    transition: background .15s, border-color .15s; list-style: none;
  }
  .opt:hover { border-color: var(--accent); }
  .opt input { margin-right: 10px; accent-color: var(--accent); }
  .opt.selected { border-color: var(--accent); background: rgba(76,141,255,.08); }
  .opt.correct { background: rgba(34,197,94,.15); border-color: var(--good); }
  .opt.wrong { background: rgba(239,68,68,.15); border-color: var(--bad); }
  .opt.disabled { cursor: default; pointer-events: none; }
  .opt-list { list-style: none; padding: 0; margin: 0; }

  .cmd-input {
    width: 100%; padding: 12px 14px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.95rem; background: #11131a; color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; outline: none;
  }
  .cmd-input:focus { border-color: var(--accent); }
  .cmd-input.correct { border-color: var(--good); background: rgba(34,197,94,.1); }
  .cmd-input.wrong { border-color: var(--bad); background: rgba(239,68,68,.1); }
  .cmd-answer-reveal { display: none; margin-top: 8px; font-size: 0.85rem; color: var(--muted); font-family: ui-monospace, monospace; }
  .cmd-answer-reveal.show { display: block; }

  .unanswered-note {
    display: none; margin-top: 8px; font-size: 0.85rem; color: var(--unanswered); font-weight: 600;
  }
  .question.flag-unanswered .unanswered-note { display: block; }

  .explanation {
    display: none; margin-top: 12px; padding: 12px; background: #11131a;
    border-left: 3px solid var(--accent); border-radius: 8px; font-size: 0.9rem; color: var(--muted);
  }
  .explanation.show { display: block; }
  .explanation b { color: var(--text); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #0b0d12; padding: 1px 5px; border-radius: 4px; }

  .controls { text-align: center; margin-top: 24px; }
  button {
    font-size: 1rem; font-weight: 600; padding: 12px 28px; border-radius: 999px;
    border: none; cursor: pointer; background: var(--accent); color: white;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.secondary { background: var(--panel); border: 1px solid var(--border); color: var(--text); }

  .results {
    display: none; text-align: center; background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 24px; margin-bottom: 20px;
  }
  .results.show { display: block; }
  .results .score { font-size: 2.4rem; font-weight: 800; }
  .results .score .good { color: var(--good); }
  .results .score .bad { color: var(--bad); }
  .results .stats { display: flex; justify-content: center; gap: 24px; margin: 12px 0; color: var(--muted); font-size: 0.9rem; flex-wrap: wrap; }
  .results .stats .n.good { color: var(--good); font-weight: 700; }
  .results .stats .n.bad { color: var(--bad); font-weight: 700; }
  .results .stats .n.unanswered { color: var(--unanswered); font-weight: 700; }
  .results .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

  .hidden { display: none !important; }

  .setup {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; margin-bottom: 20px;
  }
  .setup h2 { font-size: 1rem; margin: 0 0 12px; color: var(--muted); }
  .course-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .course-btn {
    padding: 22px 18px; border: 1px solid var(--border); border-radius: 14px;
    background: #11131a; color: var(--text); text-align: left; cursor: pointer;
  }
  .course-btn:hover { border-color: var(--accent); }
  .course-btn .t { font-weight: 700; font-size: 1.05rem; display: block; margin-bottom: 6px; }
  .course-btn .c { font-size: 0.8rem; color: var(--muted); }

  .set-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px; margin-bottom: 20px;
  }
  .set-btn {
    padding: 14px; border: 1px solid var(--border); border-radius: 10px;
    background: #11131a; color: var(--text); text-align: left; cursor: pointer;
    font-weight: 600; font-size: 0.85rem;
  }
  .set-btn:hover { border-color: var(--accent); }
  .set-btn .c { display: block; font-size: 0.75rem; color: var(--muted); font-weight: 400; margin-top: 4px; }
  .backlink { display: inline-block; margin-bottom: 14px; color: var(--muted); cursor: pointer; font-size: 0.85rem; }
  .backlink:hover { color: var(--accent); }
  #allSetsBtn { width: 100%; }

  .lang-toggle { display: flex; justify-content: center; gap: 6px; margin-bottom: 14px; }
  .lang-btn {
    padding: 6px 16px; font-size: 0.8rem; font-weight: 600; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel); color: var(--muted); cursor: pointer;
  }
  .lang-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

  .section-tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .tab-btn {
    padding: 8px 20px; font-size: 0.9rem; font-weight: 600; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel); color: var(--muted); cursor: pointer;
  }
  .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

  .ref-module {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; margin-bottom: 16px;
  }
  .ref-module h2 { margin: 0 0 16px; font-size: 1.1rem; }
  .ref-section { margin-bottom: 22px; }
  .ref-section:last-child { margin-bottom: 0; }
  .ref-section h3 {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    margin: 0 0 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px;
  }
  .ref-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .ref-item:last-child { border-bottom: none; }
  .ref-item .ref-title { font-weight: 700; margin-bottom: 4px; }
  .ref-item .ref-title code { font-size: 0.95em; }
  .ref-item .ref-body { color: var(--muted); font-size: 0.92rem; line-height: 1.5; }
  .ref-flags { list-style: none; margin: 8px 0 0; padding: 0; }
  .ref-flags li { font-size: 0.88rem; color: var(--muted); margin-bottom: 4px; }
  .ref-flags code { color: var(--text); }
  .ref-examples { margin: 8px 0 0; display: flex; flex-direction: column; gap: 6px; }
  .ref-examples code {
    display: block; padding: 8px 10px; background: #0b0d12; border-radius: 6px;
    font-size: 0.88rem; white-space: pre-wrap; word-break: break-word;
  }
  .ref-steps { margin: 8px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; }
  .ref-steps li { font-size: 0.9rem; }
  .ref-steps .ref-step-text { color: var(--muted); margin-bottom: 4px; }
  .ref-steps code {
    display: block; padding: 8px 10px; background: #0b0d12; border-radius: 6px;
    font-size: 0.88rem; white-space: pre-wrap; word-break: break-word;
  }

  .slide-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .slide-item a {
    display: block; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px;
    background: #11131a; color: var(--text); text-decoration: none; font-weight: 600; font-size: 0.9rem;
  }
  .slide-item a:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="lang-toggle">
    <button class="lang-btn" id="langViBtn" type="button">VI</button>
    <button class="lang-btn" id="langEnBtn" type="button">EN</button>
  </div>

  <div class="section-tabs" id="sectionTabs"></div>

  <header>
    <h1 id="pageTitle">Hệ điều hành mạng UET</h1>
    <p id="subtitle"></p>
  </header>

  <div class="setup hidden" id="setup">
    <h2 id="setupHeading">Chọn chủ đề</h2>
    <div class="set-grid" id="setGrid"></div>
    <button id="allSetsBtn">Làm tất cả</button>
  </div>

  <div class="topbar hidden" id="topbar">
    <div class="count" id="count">0 / 0</div>
    <div class="timer" id="timer">45:00</div>
  </div>
  <div class="progress-bar hidden" id="progressBar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div class="results" id="results">
    <div class="score"><span id="scoreGood" class="good">0</span> / <span id="scoreTotal">0</span></div>
    <div class="stats">
      <div><span id="statGoodLabel">Đúng</span>: <span class="n good" id="statGood">0</span></div>
      <div><span id="statBadLabel">Sai</span>: <span class="n bad" id="statBad">0</span></div>
      <div><span id="statUnansweredLabel">Bỏ qua</span>: <span class="n unanswered" id="statUnanswered">0</span></div>
    </div>
    <div class="actions">
      <button id="restartBtn">Chọn chủ đề khác</button>
    </div>
  </div>

  <div id="questions"></div>

  <div class="controls hidden" id="controls">
    <button id="submitBtn">Nộp bài</button>
  </div>

  <div class="setup hidden" id="referenceView">
    <span class="backlink" id="backToReferenceList">&lt; Quay lại danh sách chủ đề</span>
    <div id="referenceContent"></div>
  </div>
</div>

<script src="data/netos.js"></script>
<script src="data/netos.en.js"></script>
<script src="data/reference.js"></script>
<script src="data/reference.en.js"></script>
<script src="app.js"></script>
</body>
</html>
